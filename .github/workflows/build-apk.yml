
name: Build MYANMAR AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project
        run: flutter create --platforms=android --project-name myanmar_ai .

      - name: Set Android compile SDK
        run: |
          sed -i -E 's/^[[:space:]]*compileSdk[[:space:]]*=.*/    compileSdk = 36/' android/app/build.gradle.kts

      - name: Add Internet Permission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          if "android.permission.INTERNET" not in s:
              s = re.sub(
                  r'(<manifest\b[^>]*>)',
                  r'\1\n    <uses-permission android:name="android.permission.INTERNET"/>',
                  s,
                  count=1
              )
              p.write_text(s)
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Generate App Icon
        run: dart run flutter_launcher_icons

      - name: Build APK
        run: flutter build apk --release --dart-define=WORKER_URL=${{ secrets.WORKER_URL }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MYANMAR-AI-APK
          path: build/app/outputs/flutter-apk/app-release.apk
